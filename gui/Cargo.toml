[package]
name = "chess4p-gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "chess4p-gui"
path = "src/main.rs"

[dependencies]
chess4p-game = { path = "../game" }
eframe = "0.31"
egui = "0.31"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "directml", "api-20"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
