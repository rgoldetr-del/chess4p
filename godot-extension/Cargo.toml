[package]
name = "chess-analyzer"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
chess4p-game = { path = "../game" }
godot = { git = "https://github.com/godot-rust/gdext", branch = "master" }
ort = { version = "2.0.0-rc.13", features = ["load-dynamic", "directml", "cuda"] }